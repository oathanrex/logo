<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Gradient Ring Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }
    
    .video-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Animated Gradient Ring Container */
    .gradient-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff6b35,
        #f7931e,
        #ffcc00,
        #ff6b35,
        #f7931e,
        #ff3366,
        #ff6b35
      );
      animation: rotate-gradient 2s linear infinite;
    }
    
    /* Glow Effect */
    .gradient-ring::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: inherit;
      filter: blur(20px);
      opacity: 0.7;
      z-index: -1;
    }
    
    /* Outer Glow Pulse */
    .gradient-ring::after {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: inherit;
      filter: blur(40px);
      opacity: 0.4;
      z-index: -2;
      animation: pulse-glow 1.5s ease-in-out infinite alternate;
    }
    
    /* Main Video Circle - Directly on top of gradient */
    .video-circle {
      width: 290px;
      height: 290px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    
    .video-circle video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    /* Animations */
    @keyframes rotate-gradient {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    
    @keyframes pulse-glow {
      0% {
        opacity: 0.3;
        transform: scale(1);
      }
      100% {
        opacity: 0.6;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <!-- Animated Gradient Ring -->
    <div class="gradient-ring"></div>
    
    <!-- Video Circle -->
    <div class="video-circle">
      <video autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/oathanrex/logo/main/logo_video.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </div>
  </div>
</body>
</html>
